services:
  - type: web
    name: eltwenz-store
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: STORE_SCHEMA
        value: legacy
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
