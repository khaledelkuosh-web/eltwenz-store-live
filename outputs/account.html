<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10100f"><title>حسابي | Eltwenz Store</title><link rel="stylesheet" href="/account.css"></head>
<body>
<header class="account-header"><a href="/#products">← رجوع للمتجر</a><a href="/" class="brand"><img class="brand-logo" src="/products/logo.jpg" alt="">Eltwenz Store</a></header>
<main class="account-wrap">
  <section id="authPanel" class="account-card">
    <p class="eyebrow">حساب العميل</p><h1 id="formTitle">تسجيل الدخول</h1><p class="muted">سجّل بياناتك مرة واحدة عشان تتعبى تلقائيًا وقت الطلب.</p>
    <div class="mode-switch"><button id="showLogin" type="button" class="active">دخول</button><button id="showRegister" type="button">حساب جديد</button></div>
    <form id="loginForm" class="account-form"><label>رقم التليفون<input name="phone" required minlength="7" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></label><label>كلمة المرور<input name="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="gold-button" type="submit">دخول</button></form>
    <form id="registerForm" class="account-form" hidden><label>الاسم بالكامل<input name="name" required minlength="2" maxlength="80" autocomplete="name"></label><label>رقم التليفون<input name="phone" required minlength="7" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></label><label>كلمة المرور<input name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password"><small>٨ أحرف على الأقل.</small></label><label>المحافظة<select name="governorate" required><option value="">اختار المحافظة</option></select></label><label>المدينة / المركز<select name="city" required disabled><option value="">اختار المحافظة الأول</option></select></label><label name="otherCityLabel" hidden>اكتب المدينة أو المركز<input name="otherCity" maxlength="80" placeholder="اكتب اسم المدينة أو القرية"></label><label>الشارع والعنوان بالتفصيل<textarea name="address" required minlength="8" maxlength="500" autocomplete="street-address" placeholder="الشارع، رقم العمارة والشقة، وأقرب علامة مميزة"></textarea></label><button class="gold-button" type="submit">إنشاء حساب</button></form>
    <p id="accountMessage" class="message" role="status"></p>
  </section>
  <section id="profilePanel" class="account-card" hidden><p class="eyebrow">حسابك</p><h1>أهلاً <span id="welcomeName"></span></h1><p class="muted">بياناتك هتظهر تلقائيًا لما تبعت طلب من نفس المتصفح.</p><form id="profileForm" class="account-form"><label>الاسم بالكامل<input name="name" required minlength="2" maxlength="80" autocomplete="name"></label><label>رقم التليفون<input name="phone" required minlength="7" maxlength="20" inputmode="tel" autocomplete="tel"></label><label>المحافظة<select name="governorate" required><option value="">اختار المحافظة</option></select></label><label>المدينة / المركز<select name="city" required disabled><option value="">اختار المحافظة الأول</option></select></label><label name="otherCityLabel" hidden>اكتب المدينة أو المركز<input name="otherCity" maxlength="80" placeholder="اكتب اسم المدينة أو القرية"></label><label>الشارع والعنوان بالتفصيل<textarea name="address" required minlength="8" maxlength="500" autocomplete="street-address"></textarea></label><button class="gold-button" type="submit">حفظ بياناتي</button><button id="logoutButton" class="secondary-button" type="button">تسجيل الخروج</button></form><p id="profileMessage" class="message" role="status"></p></section>
</main>
<script src="/locations.js"></script><script src="/account.js"></script>
</body></html>
